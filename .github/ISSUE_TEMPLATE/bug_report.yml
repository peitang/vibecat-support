name: Bug report
description: Report a VibeCat issue without sharing source code or secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing a bug, open VibeCat > Settings > About and choose "Create and Upload Support Bundle". Paste the returned Support ID below.

        Do not paste source code, raw logs, prompts, terminal output, license keys, API tokens, payment data, or secrets.
  - type: input
    id: support-id
    attributes:
      label: Support ID
      description: Required for bug triage. It should look like SUP-YYYYMMDD-XXXXXXXX.
      placeholder: "SUP-20260524-1A2B3C4D"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: VibeCat version
      description: Find this in Settings > About.
      placeholder: "5.1.2"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation / update
        - Billing / license
        - Claude integration
        - Codex integration
        - Gemini integration
        - Aider integration
        - Terminal switching
        - Diagnostics / report
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keep this high level. Do not include private source code, prompts, raw logs, or secrets.
      placeholder: "1. Open Settings > About\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional public-safe context
      description: Optional. Only add high-level details. Do not attach raw logs, source code, prompts, terminal output, license keys, or payment data.
      placeholder: "Anything else support should know without private data."
    validations:
      required: false
