name: Bug report
description: Report a VibeCat issue without sharing source code or secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a VibeCat issue.

        Please include only public-safe information. Do not paste source code, prompts, terminal transcripts, license keys, API tokens, payment data, or secrets. Logs, screenshots, and recordings are optional, but review/redact them before posting.
  - type: input
    id: app-version
    attributes:
      label: VibeCat version
      description: Required. Find this in VibeCat > Settings > About.
      placeholder: "5.1.2"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      description: Required. Include Windows version and build if you know it.
      placeholder: "Windows 11 24H2 build 26100"
    validations:
      required: true
  - type: dropdown
    id: cli-tool
    attributes:
      label: CLI/tool involved
      description: Required. Pick the main tool affected by this issue.
      options:
        - Aider
        - Claude Code
        - Codex CLI
        - Cursor
        - Gemini CLI
        - Other / not sure
        - VibeCat app only
        - VS Code
    validations:
      required: true
  - type: dropdown
    id: host-app
    attributes:
      label: Terminal or developer app
      description: Required. Pick where the issue happened.
      options:
        - Command Prompt
        - Cursor terminal
        - Other / not sure
        - PowerShell
        - VS Code terminal
        - WezTerm
        - Windows Terminal
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Required. Describe the visible problem and what you expected to happen.
      placeholder: "Example: I clicked a Codex session in VibeCat, but it did not switch to the matching Windows Terminal tab."
    validations:
      required: true
  - type: input
    id: support-id
    attributes:
      label: Support ID
      description: Optional. If you already used VibeCat > Settings > About > Create and Upload Support Bundle, paste the returned ID here.
      placeholder: "SUP-20260524-1A2B3C4D"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Optional. High-level steps are enough.
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Public-safe logs
      description: Optional. Paste only logs you have reviewed and redacted. Do not include secrets, prompts, source code, full terminal transcripts, paths to private repos, license keys, or API tokens.
      placeholder: "Paste redacted log excerpts here, or write 'attached' if you attach a reviewed file."
    validations:
      required: false
  - type: textarea
    id: media
    attributes:
      label: Screenshots or screen recording
      description: Optional. Drag screenshots or recordings here if they help explain the issue. Review them first for private text, secrets, prompts, and file paths.
      placeholder: "Attach screenshots/recordings here, or describe what they show."
    validations:
      required: false
